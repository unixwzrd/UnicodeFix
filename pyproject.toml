[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unicodefix"
version = "2.0.0"
description = "Audit and safely clean Unicode, text provenance, and formatting artifacts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "confusable-homoglyphs==3.3.1",
  "ftfy>=6.2",
  "mdformat>=1.0.0",
  "mdformat-frontmatter",
  "mdformat-gfm",
  "regex>=2026.4.4",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
  "tree-sitter-language-pack>=0.9.0",
  "unicodedata2>=17.0.0,<18",
]

[project.urls]
Homepage = "https://github.com/unixwzrd/UnicodeFix"
Repository = "https://github.com/unixwzrd/UnicodeFix"
Changelog = "https://github.com/unixwzrd/UnicodeFix/blob/main/CHANGELOG.md"
Documentation = "https://github.com/unixwzrd/UnicodeFix/blob/main/docs/cleanup-text.md"

[project.optional-dependencies]
watermark-lab = ["torch>=2.4", "transformers>=4.46"]
dev = [
    "black>=24.0",
    "ruff>=0.16.3,<0.17",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
cleanup-text = "unicodefix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unicodefix"]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests", "research"]

[tool.ruff.lint]
# Match Ruff 0.16+ default selection so local pre-push and CI stay aligned.
extend-select = []
